name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install '.[test]'
      - run: pytest -q
      - run: biomotiflab data/example/train.fasta --test-fasta data/example/test.fasta --width 10 --starts 4 --shuffles 19 --out /tmp/biomotiflab-smoke
